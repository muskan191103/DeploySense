services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deploysense
      POSTGRES_USER: deploysense
      POSTGRES_PASSWORD: deploysense
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deploysense -d deploysense"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: